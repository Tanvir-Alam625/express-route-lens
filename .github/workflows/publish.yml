name: Publish package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$TAG_VERSION" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            echo "Create the tag $EXPECTED_TAG instead."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Publish to npm
        run: npm publish --access public --provenance
